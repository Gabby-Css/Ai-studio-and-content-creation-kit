<!doctype html><html><head><meta charset="utf-8"><style>
/* ============================================================================
   E8 — CHROME  (Higgsfield plate + composited type)
   Plate: hf-plates/chrome2.mp4 — molten liquid gunmetal, top-down, hard raking light,
   two-thirds dark (broll, full beats). Transparent type layer only.

   TYPE SYSTEM (distinct from every other edit):
     DISPLAY  Oswald heavy condensed caps, LEFT-anchored brutalist blocks
     BODY     Space Mono — technical, spec-plate feel
     COLOUR   brushed silver (a white→steel vertical gradient on the type) + one hairline steel rule
     MOTION   SLAM: type arrives hard with a back-out overshoot, and a bright SHEEN sweeps across
              it once as it lands — the metal catching light. This is the ONLY edit that slams + sheens.
   ============================================================================ */
@font-face{ font-family:'Osw';  src:url('oswald.ttf'); }
@font-face{ font-family:'Mono'; src:url('spacemono.ttf'); }
*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ width:1920px; height:1080px; overflow:hidden; background:transparent; }
body{ font-family:'Mono',monospace; -webkit-font-smoothing:antialiased; }
#stage{ position:absolute; inset:0; }
.sc{ position:absolute; inset:0; opacity:0; }
.osw{ font-family:'Osw',sans-serif; font-weight:700; text-transform:uppercase; }
.mono{ font-family:'Mono',monospace; }
.steel{ background:linear-gradient(180deg,#FFFFFF 0%,#E7ECF1 38%,#9AA6B2 72%,#C9D2DA 100%);
        -webkit-background-clip:text; background-clip:text; color:transparent; }
</style></head><body><div id="stage"></div><script>
const S = document.getElementById('stage');
const el = (cls, parent, txt) => { const d = document.createElement('div');
  if (cls) d.className = cls; if (txt !== undefined) d.textContent = txt;
  (parent || S).appendChild(d); return d; };
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const p01=(lt,d,len)=>clamp((lt-d)/len,0,1);
const backOut = p => { const c=2.0; return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2); };
const outCubic = p => 1-Math.pow(1-p,3);

const FPS_POSTERIZE=12, STEP=1/FPS_POSTERIZE;
const STEELCOL='#C9D2DA', DIM='rgba(201,210,218,0.55)', RULE='rgba(201,210,218,0.5)';

const SCENES = [
  { full:1, at:0.30,  dur:5.35, kind:'hero', k:'01 / THE GRIND',  a:'POSTING',   b:'BY HAND' },
  { full:0, at:6.20,  dur:1.42, kind:'tag',  l:'THERE IS A SYSTEM' },
  { full:1, at:7.80,  dur:3.95, kind:'stat', k:'02 / THE MATH',   big:'300', sub:'VIDEOS CLIPPED / MONTH · ZERO EDITORS' },
  { full:0, at:12.30, dur:3.40, kind:'tag',  l:'HANDS OFF' },
  { full:1, at:16.10, dur:5.40, kind:'spec', k:'03 / THE MACHINE',rows:['DROP FILE','AUTO-EDIT','AUTO-CLIP'] },
  { full:0, at:22.00, dur:1.25, kind:'tag',  l:'CONFIGURE ONCE · TEST EACH PROJECT' },
  { full:1, at:23.50, dur:5.55, kind:'spec', k:'04 / THE SYSTEM', rows:['AUTO-POST','AUTO-CAROUSEL','AUTO-EVERYTHING'] },
  { full:0, at:29.40, dur:5.45, kind:'tag',  l:'1,000 A DAY — NOT CLICKBAIT' },
  { full:1, at:35.20, dur:2.30, kind:'hero', k:'05 / THE SHIFT',  a:'HOW YOU',   b:'ACTUALLY SCALE' },
  { full:1, at:37.80, dur:5.85, kind:'stat', k:'06 / THE PIPELINE',big:'ONE', sub:'FOLDER FEEDS EVERY PLATFORM' },
  { full:0, at:44.00, dur:4.55, kind:'tag',  l:'EVERY PLATFORM YOU HAVE' },
  { full:1, at:49.05, dur:5.15, kind:'hero', k:'07 / THE CLAIM',  a:'THAT IS A', b:'GAME CHANGER' },
  { full:0, at:54.60, dur:5.40, kind:'tag',  l:'ONE LONG FORM IN · A YEAR OUT' },
  { full:1, at:60.30, dur:3.35, kind:'hero', k:'08 / THE CLOSE',  a:'REVIEW',   b:'THEN PUBLISH' }
];

const built = [];
SCENES.forEach(Sd => {
  const sc = el('sc');
  const o = { S:Sd, sc, parts:{} };
  if (Sd.full){
    const scrim = el('', sc);
    scrim.style.cssText='position:absolute;inset:0;background:linear-gradient(90deg, rgba(4,6,8,0.55) 0%, rgba(4,6,8,0.18) 46%, rgba(4,6,8,0.0) 70%);';
    o.parts.scrim = scrim;
  }
  const mkSheen = (host) => { const sh = el('', host);
    sh.style.cssText='position:absolute;inset:0;pointer-events:none;opacity:0;background:'+
      'linear-gradient(105deg, rgba(255,255,255,0) 40%, rgba(255,255,255,0.55) 50%, rgba(255,255,255,0) 60%);'+
      'mix-blend-mode:screen;'; return sh; };

  if (Sd.kind==='hero'){
    const wrap = el('', sc);
    wrap.style.cssText='position:absolute;left:130px;top:400px;overflow:hidden;';
    const k = el('mono', wrap, Sd.k);
    k.style.cssText='font-size:22px;letter-spacing:.4em;color:'+DIM+';margin-bottom:22px;';
    const a = el('osw steel', wrap, Sd.a);
    a.style.cssText='font-size:170px;line-height:.9;';
    const b = el('osw steel', wrap, Sd.b);
    b.style.cssText='font-size:170px;line-height:.9;';
    const rule = el('', wrap); rule.style.cssText='height:3px;width:0;background:'+STEELCOL+';margin-top:30px;';
    const sh = mkSheen(wrap);
    o.parts=Object.assign(o.parts,{ wrap,k,a,b,rule,sh });
  }
  if (Sd.kind==='stat'){
    const wrap = el('', sc);
    wrap.style.cssText='position:absolute;left:130px;top:320px;overflow:hidden;';
    const k = el('mono', wrap, Sd.k);
    k.style.cssText='font-size:22px;letter-spacing:.4em;color:'+DIM+';margin-bottom:14px;';
    const big = el('osw steel', wrap, Sd.big);
    big.style.cssText='font-size:'+(Sd.big.length>3?'220px':'300px')+';line-height:.82;';
    const sub = el('mono', wrap, Sd.sub);
    sub.style.cssText='font-size:24px;letter-spacing:.14em;color:'+DIM+';margin-top:22px;text-transform:uppercase;';
    const sh = mkSheen(wrap);
    o.parts=Object.assign(o.parts,{ wrap,k,big,sub,sh });
  }
  if (Sd.kind==='spec'){
    const wrap = el('', sc);
    wrap.style.cssText='position:absolute;left:130px;top:300px;';
    const k = el('mono', wrap, Sd.k);
    k.style.cssText='font-size:22px;letter-spacing:.4em;color:'+DIM+';margin-bottom:40px;';
    const rows = Sd.rows.map((t,i)=>{ const r = el('', wrap);
      r.style.cssText='display:flex;align-items:baseline;gap:30px;margin-bottom:24px;opacity:0;overflow:hidden;';
      const n = el('mono', r, String(i+1).padStart(2,'0')); n.style.cssText='font-size:34px;color:'+STEELCOL+';';
      const t2 = el('osw steel', r, t); t2.style.cssText='font-size:98px;line-height:1.0;';
      return r; });
    o.parts=Object.assign(o.parts,{ wrap,k,rows });
  }
  if (Sd.kind==='tag'){
    const wrap = el('', sc);
    wrap.style.cssText='position:absolute;left:130px;bottom:150px;overflow:hidden;padding:14px 0;';
    const bar = el('', wrap); bar.style.cssText='height:4px;width:0;background:'+STEELCOL+';margin-bottom:20px;';
    const l = el('osw steel', wrap, Sd.l); l.style.cssText='font-size:78px;line-height:1.0;';
    const sh = mkSheen(wrap);
    o.parts=Object.assign(o.parts,{ wrap,bar,l,sh });
  }
  built.push(o);
});

/* slam: back-out scale + hard drop into place. sheen: a white band swept once across. */
function slam(node, pr){
  node.style.opacity = pr>0?1:0;
  node.style.transform = 'translateY('+((1-backOut(pr))*-40).toFixed(1)+'px) scale('+(0.92+backOut(pr)*0.08).toFixed(3)+')';
}
function sheen(node, pr){ node.style.opacity = pr>0&&pr<1?0.9:0;
  node.style.transform='translateX('+((-40+pr*180)).toFixed(1)+'%)'; }

function seek(tRaw){
  const t = Math.floor(tRaw/STEP)*STEP;
  built.forEach(o=>{
    const S=o.S, lt=t-S.at, on=lt>=-0.001&&lt<=S.dur;
    o.sc.style.opacity=on?1:0;
    if(!on) return;
    const P=o.parts;
    if(P.scrim) P.scrim.style.opacity=p01(lt,0,0.4);
    if(S.kind==='hero'){
      P.k.style.opacity=p01(lt,0.08,0.3);
      slam(P.a, p01(lt,0.18,0.34)); slam(P.b, p01(lt,0.30,0.34));
      P.rule.style.width=(480*outCubic(p01(lt,0.7,0.4)))+'px';
      if(P.sh) sheen(P.sh, p01(lt,0.42,0.5));
    }
    if(S.kind==='stat'){
      P.k.style.opacity=p01(lt,0.08,0.3);
      slam(P.big, p01(lt,0.16,0.36)); P.sub.style.opacity=p01(lt,0.55,0.4);
      if(P.sh) sheen(P.sh, p01(lt,0.4,0.5));
    }
    if(S.kind==='spec'){
      P.k.style.opacity=p01(lt,0.08,0.3);
      P.rows.forEach((r,i)=>slam(r, p01(lt,0.28+i*0.30,0.32)));
    }
    if(S.kind==='tag'){
      P.bar.style.width=(320*outCubic(p01(lt,0.04,0.3)))+'px';
      slam(P.l, p01(lt,0.14,0.34));
      if(P.sh) sheen(P.sh, p01(lt,0.34,0.5));
    }
  });
}
window.__seek=seek; seek(0); window.__ready=true;
</script></body></html>
